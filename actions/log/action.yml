name: 'git-ratchet log'
description: >
  Record a ref's current object in the repository's transparency log, and push
  the entry. Local: no key, and no witnesses are contacted.

inputs:
  ref:
    description: 'Full ref path to record (e.g. refs/heads/main)'
    required: true
  version:
    description: 'git-ratchet version to install (e.g. "v0.1.0"). Defaults to latest.'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Install git-ratchet
      uses: project-oak/git-ratchet/actions/setup@dd5ec29512405226f6858958108040ab39458845 # v0.3.0
      with:
        tool: git-ratchet
        version: ${{ inputs.version }}

    # The log has to be present before a ref can be recorded in it. It does
    # not exist on a first run.
    - name: Fetch log ref
      shell: bash
      run: git fetch origin 'refs/ratchet/log:refs/ratchet/log' 2>/dev/null || true

    - name: Record the ref in the log
      shell: bash
      run: git-ratchet log --ref "${{ inputs.ref }}"

    - name: Push the log entry
      shell: bash
      # Not --force. Each log commit is parented on the one before, so an
      # ordinary push rejects a rewritten log before any git-ratchet code
      # runs -- which is a check worth keeping, not one to override.
      run: git push origin 'refs/ratchet/log'

name: 'git-ratchet cosign'
description: >
  Witness-side cosigning Action. Parses a checkpoint request from a GitHub
  Issue, verifies and cosigns it, commits the result, and replies to the
  issue. Must be called from a workflow triggered by issues:opened.

inputs:
  witness-key:
    description: 'Witness private key file contents, as written by genkey'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install cosign
      uses: project-oak/git-ratchet/actions/setup@07aa8aa0318cf87afc7d69ff4aaf5da5a856585d # v0.1.9
      with:
        tool: cosign

    - name: Parse issue
      id: parse
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      with:
        script: |
          // The issue body carries one message/http request in a fenced block.
          const body = context.payload.issue.body;
          const match = body.match(/```http\n([\s\S]*?)```/);
          if (!match) {
            core.setFailed('No http block found in issue body');
            return;
          }
          const request = match[1];

          // The witness needs the origin to pick its trusted keys and its
          // stored state. It is the first line of the checkpoint, which sits
          // after the HTTP headers and then after the add-checkpoint preamble.
          const httpBody = request.split('\n\n').slice(1).join('\n\n');
          const note = httpBody.split('\n\n').slice(1).join('\n\n');
          const origin = note.split('\n')[0];
          if (!origin) {
            core.setFailed('Could not read an origin from the request');
            return;
          }

          core.setOutput('origin', origin);
          core.setOutput('request_body',
            Buffer.from(request).toString('base64'));

    - name: Check origin is registered
      shell: bash
      env:
        ORIGIN: ${{ steps.parse.outputs.origin }}
        ISSUE: ${{ github.event.issue.number }}
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ ! -f "origins/${ORIGIN}" ]; then
          gh issue comment "$ISSUE" \
            --body "❌ Origin \`${ORIGIN}\` is not registered."
          gh issue close "$ISSUE" --reason "not planned"
          echo "::error::Origin ${ORIGIN} is not registered"
          exit 1
        fi

    - name: Cosign
      shell: bash
      env:
        ORIGIN: ${{ steps.parse.outputs.origin }}
        REQUEST_B64: ${{ steps.parse.outputs.request_body }}
        WITNESS_KEY: ${{ inputs.witness-key }}
      run: |
        # Write request body and witness key to temporary files.
        echo "$REQUEST_B64" | base64 -d > "${RUNNER_TEMP}/request.txt"
        printf '%s\n' "$WITNESS_KEY" > "${RUNNER_TEMP}/witness.vkey"
        chmod 600 "${RUNNER_TEMP}/witness.vkey"

        # One log per origin, so one state file per origin. cosign creates it,
        # and its directory, on the first accepted submission.
        cosign \
          --request "${RUNNER_TEMP}/request.txt" \
          --origin-vkeys "origins/${ORIGIN}" \
          --stored-checkpoint "checkpoints/${ORIGIN}" \
          --key "${RUNNER_TEMP}/witness.vkey" \
          > "${RUNNER_TEMP}/response.txt"

        # Clean up key material.
        rm -f "${RUNNER_TEMP}/witness.vkey"

    - name: Commit witness state
      shell: bash
      env:
        ORIGIN: ${{ steps.parse.outputs.origin }}
      run: |
        # cosign writes the state itself, and only when it accepts. A refusal
        # leaves no file to commit, or an unchanged one; neither is a failure,
        # and treating them as one would stop the response being posted below.
        if [ ! -f "checkpoints/${ORIGIN}" ]; then
          echo "no state written: the request was refused"
          exit 0
        fi
        git config user.name "witness-bot"
        git config user.email "witness-bot@users.noreply.github.com"
        git add "checkpoints/${ORIGIN}"
        if git diff --cached --quiet; then
          echo "witness state unchanged"
          exit 0
        fi
        SIZE=$(sed -n '2p' "checkpoints/${ORIGIN}")
        git commit -m "cosign: ${ORIGIN} @ size ${SIZE}"
        git push

    - name: Post response to issue
      shell: bash
      env:
        ISSUE: ${{ github.event.issue.number }}
        GH_TOKEN: ${{ github.token }}
      run: |
        # The response is posted whatever its status: a refusal is an answer,
        # and the origin needs to read it to know what to do next.
        RESPONSE=$(cat "${RUNNER_TEMP}/response.txt")
        gh issue comment "$ISSUE" \
          --body "$(printf '```http\n%s\n```' "$RESPONSE")"
        gh issue close "$ISSUE" --reason "completed"

    - name: Handle failure
      if: failure()
      shell: bash
      env:
        ISSUE: ${{ github.event.issue.number }}
        GH_TOKEN: ${{ github.token }}
      run: |
        gh issue comment "$ISSUE" \
          --body "❌ Rejected. See [workflow run]\
        (${{ github.server_url }}/${{ github.repository }}/actions/\
        runs/${{ github.run_id }})."
        gh issue close "$ISSUE" --reason "not planned"

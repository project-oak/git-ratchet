name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gofmt:
    name: Go format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not formatted with gofmt:"
            echo "$unformatted"
            echo ""
            echo "Run 'gofmt -w .' to fix."
            exit 1
          fi

  go-mod-tidy:
    name: Go mod tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod or go.sum are not tidy. Run 'go mod tidy' and commit the changes."
            exit 1
          fi

  gazelle:
    name: Gazelle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-gazelle
          repository-cache: true

      - name: Check BUILD files are up-to-date
        run: |
          # Keep gazelle's own output. Discarding stderr and assigning the diff
          # to a variable meant that under `bash -e` a non-zero exit killed the
          # step at the assignment, reporting neither the diff nor the reason.
          set +e
          bazel run //:gazelle -- update -mode diff > "${RUNNER_TEMP}/gazelle.diff"
          status=$?
          set -e
          if [ -s "${RUNNER_TEMP}/gazelle.diff" ]; then
            echo "::error::BUILD files are out of date. Run 'bazel run //:gazelle' to regenerate."
            cat "${RUNNER_TEMP}/gazelle.diff"
            exit 1
          fi
          exit $status

name: Pages

on:
  push:
    branches: [main]
    paths: ['presentation/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# A deployment in flight should finish rather than be cancelled by the next
# push: Pages serves whatever completed last, so cancelling mid-deploy can
# leave the site on an older build than the one that started.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # Reads the deck and hands it to the Pages artifact store; writes nothing.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # presentation/ is the site root, so presentation/index.html is served at
      # the top level. The deck is self-contained apart from Google Fonts.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: presentation

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publish the deployment
      id-token: write   # OIDC token the Pages deployment is verified with
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

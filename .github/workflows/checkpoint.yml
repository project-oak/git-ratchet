name: Checkpoint

on:
  push:
    branches: [main]
    tags: ['v*']

# One log, one writer. Every run of this workflow writes refs/ratchet/log, so
# a push to main and a v* tag arriving together would race and the loser's
# push would be rejected. The group is deliberately not keyed on the ref.
concurrency:
  group: git-ratchet-log
  cancel-in-progress: false

jobs:
  log:
    name: Log (${{ github.ref_name }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: project-oak/git-ratchet/actions/log@dd5ec29512405226f6858958108040ab39458845 # v0.3.0
        with:
          ref: ${{ github.ref }}
          version: v0.3.0

  # Separate from logging so a witness that is down, slow, or refusing cannot
  # cost the repository the entry: it is already pushed by the job above.
  checkpoint:
    name: Checkpoint
    needs: log
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: project-oak/git-ratchet/actions/checkpoint@dd5ec29512405226f6858958108040ab39458845 # v0.3.0
        with:
          origin-key: ${{ secrets.ORIGIN_KEY }}
          policy: ratchet-checkpoint.policy
          github-token: ${{ secrets.WITNESS_GITHUB_TOKEN }}
          version: v0.3.0

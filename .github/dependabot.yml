version: 2

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      go:
        update-types: ["minor", "patch"]

  # The workflows, and the composite actions under actions/.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/actions/*"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # The checkpoint workflow pins a git-ratchet release on purpose, and
      # the composite actions use their own @main.
      - dependency-name: "project-oak/git-ratchet*"
    groups:
      github-actions:
        update-types: ["minor", "patch"]

  # bazel_dep versions in MODULE.bazel; Dependabot regenerates
  # MODULE.bazel.lock.
  - package-ecosystem: "bazel"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      bazel:
        update-types: ["minor", "patch"]

  # The OpenTofu providers: main.tf's required_providers and the
  # .terraform.lock.hcl beside it, which MODULE.bazel's tf_providers.from_lock
  # reads.
  - package-ecosystem: "opentofu"
    directory: "/deploy/origin"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
